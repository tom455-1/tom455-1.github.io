<title>Enregistrer un cours</title>
<style>
/* Thème commun = celui de l'overlay « Schémas bilan Biocell ».
   Clair = hémalun-éosine (lavande, indigo, rose) ; sombre = fluorescence. Polices : Bricolage Grotesque, Atkinson Hyperlegible, IBM Plex Mono. */
:root{
  --bg:#f5f4f8; --surface:#ffffff; --stage:#fbfaff; --ink:#1c1a29; --muted:#5f5a74; --line:#dedae8;
  --hema:#3d3a94; --on-hema:#ffffff; --eosin:#cf3f74; --ok:#2d8656; --warn:#b5650d;
  --cyto:#f1ecf7; --nuc:#d3cef0; --memb:#7f68b0; --lumen:#fbe1ec;
  --hl:#ffe08a; --hl-soft:#fff4cc; --shadow:rgba(28,26,41,.18);
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1018; --surface:#161925; --stage:#11141e; --ink:#e9e9f3; --muted:#a0a3bb; --line:#2a2f42;
  --hema:#8d95ff; --on-hema:#0e1018; --eosin:#ff6fa5; --ok:#52d38e; --warn:#f0a548;
  --cyto:#1d2133; --nuc:#2d3372; --memb:#a993f2; --lumen:#3e2236;
  --hl:#6b5512; --hl-soft:#2f2a17; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1018; --surface:#161925; --stage:#11141e; --ink:#e9e9f3; --muted:#a0a3bb; --line:#2a2f42;
  --hema:#8d95ff; --on-hema:#0e1018; --eosin:#ff6fa5; --ok:#52d38e; --warn:#f0a548;
  --cyto:#1d2133; --nuc:#2d3372; --memb:#a993f2; --lumen:#3e2236;
  --hl:#6b5512; --hl-soft:#2f2a17; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}

/* page en colonne, comme l'overlay */
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
.wrap>header h1{font-family:var(--f-disp);font-size:clamp(30px,5.4vw,46px);line-height:1.05;margin:0;letter-spacing:-.015em}
.wrap>header p{color:var(--muted);max-width:66ch;margin:.6rem 0 0}
.kicker{font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--hema)}
h2.sec{font-family:var(--f-disp);font-size:clamp(22px,3.2vw,29px);margin:0 0 12px;line-height:1.15}
h2.sec small{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.06em;margin-right:10px;vertical-align:3px}

/* pastilles de navigation (nav.jump de l'overlay) */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.pill:hover{border-color:var(--hema)}
.pill[aria-pressed="true"],.pill[aria-current="page"]{background:var(--hema);border-color:var(--hema);color:var(--on-hema)}
.pill:disabled{opacity:.45;cursor:default}
.pill:disabled:hover{border-color:var(--line)}

/* cartes et planches */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--hema)}
.btn.primary{background:var(--hema);border-color:var(--hema);color:var(--on-hema)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.rose{background:var(--eosin);border-color:var(--eosin);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* champs */
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.field:focus{border-color:var(--hema);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--hema) 18%,transparent)}

/* retour à l'accueil */
.back{display:inline-flex;align-items:center;gap:5px;color:var(--hema);text-decoration:none;font-weight:700;font-size:14px;padding:5px 12px 5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.back svg{width:9px;height:14px}
.back:hover{border-color:var(--hema)}

body{display:grid;place-items:center;min-height:100vh;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
main.card{width:min(420px,100%);padding:26px 24px 22px}
.card h1{font-family:var(--f-disp);font-size:34px;line-height:1.05;letter-spacing:-.015em;margin:6px 0 4px}
.card .sub{color:var(--muted);margin:0 0 20px;font-size:15px}
form{display:grid;gap:12px}
.row{display:flex;gap:8px}
.row .field{flex:1}
label.keep{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
label.keep input{accent-color:var(--hema);width:16px;height:16px}
.err{color:var(--eosin);font-weight:700;font-size:14px;min-height:20px;margin:0}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spin{color:var(--muted);font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}
</style>
</head>
<body>
<main id="login" class="card" hidden>
  <div class="kicker">ACCÈS PRIVÉ</div>
  <h1>Mes cours</h1>
  <p class="sub">Enregistrer un cours · Outils</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="cours" autocomplete="username" hidden>
    <div class="row">
      <input id="pw" class="field" type="password" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
      <button id="go" class="btn primary" type="submit">Ouvrir</button>
    </div>
    <label class="keep"><input id="keep" type="checkbox" checked> Rester connecté sur cet appareil</label>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<main id="wait" class="spin">OUVERTURE…</main>

var sub=crypto.subtle, enc=new TextEncoder();
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(u){return Array.prototype.map.call(u,function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){})}

// k = 64 octets : 32 pour AES-CTR, 32 pour HMAC-SHA256. Renvoie le HTML, ou null si la clé est fausse.
async function open(k){
  var iv=b64(P.v), ct=b64(P.c), data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  var mk=await sub.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await sub.verify('HMAC',mk,b64(P.m),data))return null;
  var ak=await sub.importKey('raw',k.slice(0,32),{name:'AES-CTR'},false,['decrypt']);
  var pt=await sub.decrypt({name:'AES-CTR',counter:iv,length:128},ak,ct);
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  var base=await sub.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},base,512));
}
function show(html){
  if(document.readyState!=='complete'){window.addEventListener('load',function(){setTimeout(function(){show(html)},0)},{once:true});return}
  document.open();document.write(html);document.close();
}
function login(){
  document.getElementById('wait').hidden=true;document.getElementById('login').hidden=false;
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
  pw.focus();
  f.addEventListener('submit',async function(e){
    e.preventDefault();go.disabled=true;go.textContent='Ouverture…';err.textContent='';
    try{
      var k=await derive(pw.value),html=await open(k);
      if(html){set(KEY,document.getElementById('keep').checked?hex(k):null);show(html);return}
      err.textContent='Mot de passe incorrect.';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');pw.select();
    }catch(x){err.textContent='Ce navigateur ne peut pas ouvrir la page.'}
    go.disabled=false;go.textContent='Ouvrir';
  });
}
(async function(){
  if(!window.crypto||!sub){document.getElementById('wait').textContent='Ouvre cette page en https dans un navigateur récent.';return}
  var saved=get(KEY);
  if(saved){try{var html=await open(unhex(saved));if(html){show(html);return}}catch(e){}set(KEY,null)}
  login();
})();
})();
