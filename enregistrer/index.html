<title>Enregistrer un cours</title>
<style>
/* Thème commun = celui de « Overlay theHunter » : noir violacé, panneaux sombres bordés,
   titres en capitales espacées, accent violet, onglets actifs entourés de violet. Sombre uniquement. */
:root{
  color-scheme:dark;
  --bg:#0f0d14; --bg-glow:rgba(110,72,200,.22);
  --surface:#17151d; --surface2:#1d1a25; --field-bg:#121017; --stage:#14121b;
  --ink:#f1f0f6; --muted:#9a96a8; --line:#2c2936; --line2:#3a3647;
  --accent:#8b5cf6; --accent-hi:#a07cff; --accent-soft:#231c3c; --on-accent:#ffffff;
  --danger:#f2726f; --danger-line:#6b2d33;
  --silver:#cfd2dc; --gold:#f4c430; --diamond:#5fd3f3; --green:#4ade80; --orange:#f59e42; --pink:#f472b6;
  /* jetons des planches de schémas (palette « fluorescence ») */
  --hema:#a07cff; --on-hema:#0f0d14; --eosin:#ff6fa5; --ok:#52d38e; --warn:#f0a548;
  --cyto:#1d2133; --nuc:#2d3372; --memb:#a993f2; --lumen:#3e2236; --chrB:#ffb04d;
  --vessel:#ff7d91; --derme:#2a1d28; --corne:#6b5f4c; --gran:#54467a; --spin:#4c4795; --basal:#7a70e0;
  --extra:#131a22; --ims:#2c1f30; --matrix:#1b1828; --chloro:#1d3323; --chloro-s:#6fcf7f; --perox:#3a3320; --meat:#c98a62;
  --hl:#5b4a12; --hl-soft:#2a2414; --piege:#2c1a24; --astuce:#152820; --why:#1d1a33; --shadow:rgba(0,0,0,.6);
  --f-disp:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",sans-serif;
  --f-body:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1100px 700px at 8% -10%,var(--bg-glow),transparent 60%),radial-gradient(900px 600px at 105% 0%,rgba(60,40,120,.14),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
::selection{background:var(--accent);color:#fff}

/* titres en capitales espacées */
.caps{text-transform:uppercase;letter-spacing:.18em;font-weight:700}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;font-weight:700;color:var(--muted)}

/* barre du haut (« OVERLAY THEHUNTER ») */
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top,0px)) 0 14px;border-bottom:1px solid var(--line)}
.topbar .brand{margin-right:auto;min-width:0}
.topbar .brand b{display:block;font-size:18px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
.topbar .brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}

/* groupe d'onglets (Overlay / Carte / Wiki / Potentiel) */
.tabgroup{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tabgroup>*{border:1.5px solid transparent;background:none;border-radius:9px;padding:7px 16px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
.tabgroup>*:hover{color:var(--ink)}
.tabgroup>[aria-pressed="true"],.tabgroup>[aria-selected="true"],.tabgroup>[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft);color:#fff;font-weight:700}
.tabgroup>*:disabled{opacity:.4;cursor:default}

/* pastilles à point de couleur (« • 1  • 2  ★ Great One ») */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line2);border-radius:999px;text-decoration:none;color:var(--ink);background:transparent;font-size:13.5px;font-weight:500;cursor:pointer}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"],.pill[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:#fff}

/* panneaux (« WIKI ») */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h h2,.panel-h h3{margin:0;font-size:18px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.panel-h span{font-size:13px;color:var(--muted)}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px}
h2.sec{font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:0 0 12px}
h2.sec small{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-left:10px;text-transform:none}

/* cartes de stat (« ARGENT 32 ») */
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 18px;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.stat .lab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .lab i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.stat .val{font-size:26px;font-weight:800;color:var(--c,var(--ink));line-height:1.2;margin-top:4px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface2);border-radius:9px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ring{border:1.5px solid var(--accent);background:var(--accent-soft)}
.btn.danger,.btn.rose{background:transparent;border-color:var(--danger-line);color:var(--danger)}
.btn.danger:hover,.btn.rose:hover{border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}

/* champs (« Rechercher une espèce… ») */
.field{width:100%;border:1px solid var(--line2);background:var(--field-bg);border-radius:10px;padding:9px 12px;color:var(--ink)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--accent);outline:none}

/* interrupteur */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--ink)}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:#2a2733;border:1px solid var(--line2);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}

/* badge numéroté (« 2 ») */
.badge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:6px;background:rgba(74,222,128,.14);color:var(--green);font-size:12px;font-weight:700}

/* retour à l'accueil */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:7px 12px 7px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2)}
.back svg{width:9px;height:14px}
.back:hover{border-color:var(--accent)}

/* barre de défilement discrète */
*{scrollbar-width:thin;scrollbar-color:#3a3647 transparent}

body{display:grid;place-items:center;min-height:100vh;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
main.card{width:min(440px,100%);padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h1{font-size:24px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1.15;margin:8px 0 4px}
.card .sub{color:var(--muted);margin:0 0 20px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
form{display:grid;gap:12px}
.row{display:flex;gap:8px}
.row .field{flex:1}
label.keep{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
label.keep input{accent-color:var(--accent);width:16px;height:16px}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:20px;margin:0}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spin{color:var(--muted);font-size:12px;letter-spacing:.18em;font-weight:700}
</style>
</head>
<body>
<main id="login" class="card" hidden>
  <div class="kicker" style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></i>Accès privé</div>
  <h1>Mes cours</h1>
  <p class="sub">Enregistrer un cours · Outils</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="cours" autocomplete="username" hidden>
    <div class="row">
      <input id="pw" class="field" type="password" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
      <button id="go" class="btn primary" type="submit">Ouvrir</button>
    </div>
    <label class="keep"><input id="keep" type="checkbox" checked> Rester connecté sur cet appareil</label>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<main id="wait" class="spin">OUVERTURE…</main>

var sub=crypto.subtle, enc=new TextEncoder();
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(u){return Array.prototype.map.call(u,function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){})}

// k = 64 octets : 32 pour AES-CTR, 32 pour HMAC-SHA256. Renvoie le HTML, ou null si la clé est fausse.
async function open(k){
  var iv=b64(P.v), ct=b64(P.c), data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  var mk=await sub.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await sub.verify('HMAC',mk,b64(P.m),data))return null;
  var ak=await sub.importKey('raw',k.slice(0,32),{name:'AES-CTR'},false,['decrypt']);
  var pt=await sub.decrypt({name:'AES-CTR',counter:iv,length:128},ak,ct);
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  var base=await sub.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},base,512));
}
function show(html){
  if(document.readyState!=='complete'){window.addEventListener('load',function(){setTimeout(function(){show(html)},0)},{once:true});return}
  document.open();document.write(html);document.close();
}
function login(){
  document.getElementById('wait').hidden=true;document.getElementById('login').hidden=false;
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
  pw.focus();
  f.addEventListener('submit',async function(e){
    e.preventDefault();go.disabled=true;go.textContent='Ouverture…';err.textContent='';
    try{
      var k=await derive(pw.value),html=await open(k);
      if(html){set(KEY,document.getElementById('keep').checked?hex(k):null);show(html);return}
      err.textContent='Mot de passe incorrect.';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');pw.select();
    }catch(x){err.textContent='Ce navigateur ne peut pas ouvrir la page.'}
    go.disabled=false;go.textContent='Ouvrir';
  });
}
(async function(){
  if(!window.crypto||!sub){document.getElementById('wait').textContent='Ouvre cette page en https dans un navigateur récent.';return}
  var saved=get(KEY);
  if(saved){try{var html=await open(unhex(saved));if(html){show(html);return}}catch(e){}set(KEY,null)}
  login();
})();
})();
