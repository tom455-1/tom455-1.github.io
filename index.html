<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cours">

<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<title>Mes cours</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--field:rgba(118,118,128,.12);--accent:#3d3a94;--err:#d70015;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--field:rgba(118,118,128,.24);--accent:#8d95ff;--err:#ff6961;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--f);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{width:min(360px,100%);text-align:center}
main[hidden]{display:none}
img{width:88px;height:88px;border-radius:20px;box-shadow:0 8px 28px rgba(61,58,148,.28)}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:20px 0 4px}
p{color:var(--muted);margin:0 0 26px;font-size:15px}
form{display:grid;gap:12px}
input[type=password]{width:100%;border:0;border-radius:12px;background:var(--field);color:var(--ink);font:inherit;padding:13px 16px;outline:none;text-align:center}
input[type=password]:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
button{border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:13px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0e1018}}
button:disabled{opacity:.5}
label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.err{color:var(--err);font-size:14px;min-height:20px;margin:0}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spin{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main id="login" hidden>
  <img src="./apple-touch-icon.png" alt="">
  <h1>Mes cours</h1>
  <p>Cours · L1</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="cours" autocomplete="username" hidden>
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Ouvrir</button>
    <label><input id="keep" type="checkbox" checked> Rester connecté sur cet appareil</label>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<main id="wait" class="spin">Ouverture…</main>

var sub=crypto.subtle, enc=new TextEncoder();
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(u){return Array.prototype.map.call(u,function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){})}

// k = 64 octets : 32 pour AES-CTR, 32 pour HMAC-SHA256. Renvoie le HTML, ou null si la clé est fausse.
async function open(k){
  var iv=b64(P.v), ct=b64(P.c), data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  var mk=await sub.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await sub.verify('HMAC',mk,b64(P.m),data))return null;
  var ak=await sub.importKey('raw',k.slice(0,32),{name:'AES-CTR'},false,['decrypt']);
  var pt=await sub.decrypt({name:'AES-CTR',counter:iv,length:128},ak,ct);
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  var base=await sub.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},base,512));
}
function show(html){
  if(document.readyState!=='complete'){window.addEventListener('load',function(){setTimeout(function(){show(html)},0)},{once:true});return}
  document.open();document.write(html);document.close();
}
function login(){
  document.getElementById('wait').hidden=true;document.getElementById('login').hidden=false;
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
  pw.focus();
  f.addEventListener('submit',async function(e){
    e.preventDefault();go.disabled=true;go.textContent='Ouverture…';err.textContent='';
    try{
      var k=await derive(pw.value),html=await open(k);
      if(html){set(KEY,document.getElementById('keep').checked?hex(k):null);show(html);return}
      err.textContent='Mot de passe incorrect.';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');pw.select();
    }catch(x){err.textContent='Ce navigateur ne peut pas ouvrir la page.'}
    go.disabled=false;go.textContent='Ouvrir';
  });
}
(async function(){
  if(!window.crypto||!sub){document.getElementById('wait').textContent='Ouvre cette page en https dans un navigateur récent.';return}
  var saved=get(KEY);
  if(saved){try{var html=await open(unhex(saved));if(html){show(html);return}}catch(e){}set(KEY,null)}
  login();
})();
})();
</script>
